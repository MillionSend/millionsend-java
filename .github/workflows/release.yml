name: Release

# Publishes the current main to Maven Central via the Central Portal.
# Requires four repo secrets (see README "Releasing"):
#   CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD — Portal user token
#   MAVEN_GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE — ASCII-armored signing key
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A tag publishes exactly the version the manifest declares; a tag that
      # disagrees with it is refused instead of shipping the wrong number.
      - name: Tag must match the manifest version
        if: github.ref_type == 'tag'
        run: test "v$(sed -n 's/.*<version>\(.*\)<\/version>/\1/p' pom.xml | head -1)" = "$GITHUB_REF_NAME"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: mvn -B -P release deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
